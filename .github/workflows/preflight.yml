name: preflight

# Gate for PRs into main: runs the same checks as scripts/preflight.sh
# (persona-agnostic content scan + structure + `claude plugin validate`).
# Make it required under Settings → Branches → branch protection for `main`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI (for `claude plugin validate`)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version   # fail loudly if the CLI isn't on PATH — preflight
                             # would otherwise skip validation instead of gating

      - name: Run preflight
        run: bash scripts/preflight.sh
